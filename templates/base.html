<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="wrapper">
        <!-- Хедер -->
        <header class="header">
            {% block header %}

            {% endblock %}
        </header>

        <!-- Основний контент -->
        <main class="main">
            {% block content %}{% endblock %}
        </main>

        <!-- Футер -->
        <footer>
            {% block footer %}
                <p>&copy; 2024 Моя Flask сторінка</p>
            {% endblock %}
        </footer>
    </div>
</body>
</html>
