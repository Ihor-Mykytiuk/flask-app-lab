<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Posts</title>
</head>
<body>
    <h1>Articles</h1>
    <ul>
    {% for post in posts %}

            {{ post["id"] }}
            <a href="post/{{ post["id"] }}">{{ post["title"] }}</a>
        </li>
    {% endfor %}
    </ul>
</body>
</html>
