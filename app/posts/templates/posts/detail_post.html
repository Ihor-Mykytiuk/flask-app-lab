{% extends 'base.html' %}
{% block content %}
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card shadow border-0">
                    <img src="{{ url_for('.static', filename='img/post-button-click.webp') }}" class="card-img-top"
                         height="400px"
                         alt="Post Image">
                    <div class="card-body p-4">
                        <h1 class="card-title text-center text-primary fw-bold">{{ post.title }}</h1>
                        <p class="text-muted text-center small">
                            {{ post.posted }} | {{ post.author }}
                        </p>
                        <hr>
                        <p class="badge bg-info px-3 py-2">{{ post.category }}</p>
                        <p class="card-text fs-5">{{ post.content }}</p>
                        <div class="mb-3">
                            {% for tag in post.tags %}
                                <span class="badge bg-secondary">{{ tag.name }}</span>
                            {% endfor %}
                        </div>
                        <div class="d-flex">
                            <a href="{{ url_for('posts.edit_post', post_id=post.id) }}" class="btn btn-warning me-2">
                                Edit
                            </a>
                            <a href="{{ url_for('posts.get_posts') }}" class="btn btn-secondary">
                                Back
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
