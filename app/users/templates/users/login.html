{% extends 'base.html' %} {% block content %}
<section class="vh-100 gradient-custom">
  <div class="container py-5 h-100">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col-12 col-md-8 col-lg-6 col-xl-5">
        <div class="card bg-dark text-white" style="border-radius: 1rem">
          <div class="card-body p-5 text-center">
            <div class="mb-md-5 mt-md-4">
              <h2 class="fw-bold mb-2 text-uppercase">Вхід</h2>
              <p class="text-white-50 mb-5">
                Будь ласка, введіть ваше ім'я користувача та пароль!
              </p>

              <form method="post">
                <div data-mdb-input-init class="form-outline form-white mb-4">
                  <input
                    type="text"
                    id="typeUsernameX"
                    name="username"
                    class="form-control form-control-lg"
                    required
                  />
                  <label class="form-label" for="typeUsernameX">Ім'я користувача</label>
                </div>

                <div data-mdb-input-init class="form-outline form-white mb-4">
                  <input
                    type="password"
                    id="typePasswordX"
                    name="password"
                    class="form-control form-control-lg"
                    required
                  />
                  <label class="form-label" for="typePasswordX">Пароль</label>
                </div>

                <button
                  data-mdb-button-init
                  data-mdb-ripple-init
                  class="btn btn-outline-light btn-lg px-5"
                  type="submit"
                >
                  Увійти
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
