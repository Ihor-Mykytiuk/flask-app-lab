{% extends 'base.html' %} {% block content %}
<section
  class="profile {% if color_scheme == 'dark' %}bg-dark text-light{% else %}bg-light text-dark{% endif %}"
>
  <div class="container">
    <div class="row align-items-center">
      <div class="col-md-8">
        <h1 class="">Профіль</h1>
        <p class="lead">Ласкаво просимо до сторінки, {{ username }}</p>
      </div>
      <div class="col-md-4 text-right">
        <a href="{{ url_for('users.logout') }}" class="btn btn-danger px-5"
          >Вихід</a
        >
        <a
          href="{{ url_for('users.set_color_scheme', scheme='light') }}"
          class="btn btn-light btn btn-outline-dark"
          >Світла схема</a
        >
        <a
          href="{{ url_for('users.set_color_scheme', scheme='dark') }}"
          class="btn btn-dark btn-outline-light"
          >Темна схема</a
        >
      </div>
    </div>
  </div>
</section>
<section
  class="cookies-handlers py-5 {% if color_scheme == 'dark' %}bg-dark text-light{% else %}bg-light text-dark{% endif %}"
>
  <div class="container">
    <div class="add-cookie-form my-3">
      <h4>Додати кукі</h4>
      <form id="addCookieForm" method="POST">
        <div class="mb-3 row">
          <div class="form-group col-md-4">
            <label for="cookieKey">Ключ кукі:</label>
            <input
              type="text"
              class="form-control"
              id="cookieKey"
              name="cookie_key"
              required
            />
          </div>
          <div class="form-group col-md-4">
            <label for="cookieValue">Значення кукі:</label>
            <input
              type="text"
              class="form-control"
              id="cookieValue"
              name="cookie_value"
              required
            />
          </div>
          <div class="form-group col-md-4">
            <label for="cookieExpire">Термін дії:</label>
            <input
              type="number"
              class="form-control"
              id="cookieExpire"
              name="cookie_expire"
              required
            />
          </div>
        </div>
        <button
          type="submit"
          class="btn btn-primary col-md-2"
          name="add_cookie"
        >
          Додати кукі
        </button>
      </form>
    </div>
    <div class="remove-cookie-form my-3">
      <h4 class="mt-5">Видалити кукі</h4>
      <form id="removeCookieForm" method="POST">
        <div class="form-group mb-3">
          <label for="removeKey">Ключ кукі для видалення:</label>
          <input
            type="text"
            class="form-control"
            id="removeKey"
            name="remove_key"
          />
        </div>
        <button
          type="submit"
          class="btn btn-warning"
          name="remove_cookie_by_key"
        >
          Видалити кукі
        </button>
        <button
          type="submit"
          class="btn btn-danger"
          id="removeAllCookies"
          name="remove_all_cookies"
        >
          Видалити всі кукі
        </button>
      </form>
    </div>
    <div class="cookie-display">
      <h4 class="mt-5">Список кукі</h4>
      <table
        class="table table-striped table-bordered {% if color_scheme == 'dark' %} table-dark {% else %}table-light{% endif %}"
      >
        <thead class="thead-light">
          <tr>
            <th>Ключ</th>
            <th>Значення</th>
          </tr>
        </thead>
        <tbody>
          {% for key, value in cookies.items() %}
          <tr>
            <td>{{ key }}</td>
            <td>{{ value }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</section>
{% endblock %}
